title: "[Question]: "
body:
  - type: markdown
    attributes:
      value: "Ask about using Ace. Search existing answers first. This is public; leave out account details and health records."
  - type: textarea
    id: question
    attributes:
      label: What would you like help with?
      description: Explain what you are trying to do and what you have already tried.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version and device, if relevant
